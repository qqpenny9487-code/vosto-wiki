        <h2 id="a">描述</h2>
        <hr />
        <p>該條目正在施工中。</p>

        <h2 id="b">外貌</h2>
        <hr />
        <p>擁有一頭灰白色的短直髮，齊瀏海往兩側撥開，僅留幾縷髮絲漂散在額前，長度不至於遮蓋眼睛。一雙棕色的桃花眼下方各有著兩條極淡的暗紅色短疤，這些疤痕是妖族痕跡在人型態下無法完全抹滅的證明。</p>
        <p>白雪惜用法術將外貌定格在二十三歲，也能隨意易容成他人的模樣，但平時並不這麼做。</p>
        <p>其舌頭末端像蛇信一樣分岔，且能分別操控，嘴角總是噙著一抹溫和有禮的淡笑，配上他濕漉漉的桃花眼，極勾人心弦，左側鎖骨下方約一指幅處有一顆朱紅色的小痣。</p>
        <p>耳朵與尾巴在外出時會隱藏，在家中則會自由顯現，能自主控制獸化程度，變身後的毛髮顏色也與髮色一樣，皆為灰白色。</p>
        <p>非常享受日光浴，常在太陽下曝曬整個上午，直到中午才會找尋陰涼處躲起來午睡。這使得白雪惜的皮膚在衣物遮蓋處與曝曬處有明顯色差。儘管如此，他的皮膚狀態依舊良好，手部纖細，而衣物下的膚色是偏白但非蒼白。</p>
        <p>由於沒有健身習慣，身體顯得有些單薄，習慣使用法力來生活和戰鬥，切勿因其單薄的體態而誤判他的力量。</p>
        <b>服裝：</b>    
        <p>．平時以舒適為重，多是棉質的衣褲，在家中時不喜歡穿鞋子，通常赤腳。</p>
        <p>．重要場合：內裡是一件長袖白底黑格子衫，衣袖長至手腕。襯衫採用燕尾設計，但長度不像正式燕尾服那樣誇裝，並繫著一條藍灰色領帶。襯衫外罩著一條半身黑色外套，外套的高領口與襯衫領口相連。領口可以扣上，右邊領口在上方並繡有一顆黃色的五芒星。外套本身沒有拉鍊，而是用兩條縫製的繩子與安全扣固定。</p>    
        <p>下身是一條黑色西裝褲，繫著一條被上衣蓋住、看不見的棕色皮帶，不過被衣服蓋住，右耳配戴著一個「Si」字的黑色耳飾，是自己名字「惜」的羅馬拼音最後一個字。</p>
        <br />

        <h2 id="c">個性</h2>
        <hr />
        <p>是一個極獨懶惰的人，凡事能拖就拖。當他人忙碌時，他總是躲起來偷閒。由於習慣拖延，往往會在期限截止前夕才發現工作已積累到驚人的數量，此時，白雪惜會將自己鎖在房內熬夜趕工，甚至需要一杯黑咖啡提神，不允許任何人打擾。一旦完成，能足足睡上一整天，除非聽到關鍵字「甜食」等，否則怎麼樣都叫不醒。</p>
        <p>這種懶散的態度時常引來他人的不滿，但他總一笑置之，深知這樣不好，卻無力改變。然而，他的懶惰僅限於工作，對待生活卻相當勤勞，也十分陽光和自信，家裡整潔有序，對慶典也充滿熱忱。</p>
        <p>與人發生衝突時，總會敷衍了事，口頭上承諾會去執行，其實並不然。不喜歡爭輸贏，寧可直接認輸，也不願浪費時間爭吵。一旦被徹底惹毛，比起動口，他更樂於動手，畢竟體內還是流淌著妖族血液，殘存著些許兇惡本性。這種本性也體現在訓練場上，能來上一場酣暢淋漓的戰鬥，善用長劍、法術。</p>
        <p>對於信任之人，會展現出極強的依賴性，總是賴著不走，彷彿眼中只剩下對方一人。如果惹對方生氣，會乖巧的任由責備，若是面臨拳腳相向，卻會因膽小而直接逃走，但又不敢離開太遠，只敢偷偷觀望，或轉而尋找其他依賴對象。</p>
        <p>這種性格在床笫之間會徹底反轉，歡愉時，彷彿變了一個人，變得異常強硬，甚至崇尚著窒息帶來的快感，會用獸化的尖利牙齒留下大片讓人吃痛的痕跡，並喜歡反覆折磨，將人推上頂點，卻又不讓人徹底發洩，展現出強烈的反差，興許是妖族本性的釋放和強烈的佔有導致。</p>
        <p>此外，白雪惜酒量極佳，很少喝醉；一旦喝醉，會變得異常安靜，抱著某樣東西不動，隔天則完全忘光。</p>
        <p>白雪惜似乎不管到哪裡都能適應的很好，也許他適應的不快，但幾乎沒出現適應不良的問題，這大概是千年大妖的餘裕吧。</p>

        <h2 id="d">背景故事</h2>
        <hr />
        <p>白雪惜是一隻千年大妖，也許正是渡過了太漫長的歲月，導致個性變得懶散。作為純血狐妖的後代，父母皆是絕世美人，而他也完美繼承了雙方的優點。除了擁有強大的能力和優秀的法力，他的容貌英俊柔美、剛中帶柔，在整個狐族中也屬出眾。</p>
        <p>至於他現在為何會工作，起因是他隨筆寫下的興趣之作，竟意外聚集了大量讀者，甚至還引來出版社為他配了一位專屬編輯。所幸他發現，信仰愈強，或記住自己的人越多，法力便會在基礎值上獲得加承。這讓原本只想當個閒散大妖、隱匿於人界的他，只能抱著無奈的心情，提筆繼續書寫，也導致時常拖到截稿前一夕，才將內容堪堪完成。</p>
        <p>白雪惜只需偶爾回妖界探望父母即可。他的父母是人人稱羨的佳偶，並為他帶來大批手足，對此，他表示無感，認為「妖生漫長，想怎麼活全憑個人意志」。由於長期待在人界，與手足之間關係稱不上親密，但也說不上差，較常在聯絡的頂多只有幾個閒得發慌的會來借住幾天。</p>
        <p>或許正是因為沒有繼承的壓力，他只需盡情地玩樂即可。不過，他並非不學無術，那些該掌握的知識一個都沒有落下。畢竟，在一個龐大的大家族中，蠢笨之人是無法生存的。</p>
        <p>出於某個原因來到了聯邦。</p>
